<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Latent Space Explorer</title>
    <!-- Inline, damit der Browser nicht bei jedem Laden vergeblich nach
         /favicon.ico fragt und die Konsole mit einem 404 verunreinigt. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='5' cy='6' r='2.4' fill='%23e69f00'/%3E%3Ccircle cx='11' cy='5' r='2' fill='%23009e73'/%3E%3Ccircle cx='9' cy='11' r='2.6' fill='%2356b4e9'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07080c;
        --fg: #e8e9ee;
        --dim: #868a99;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow: hidden;
      }
      canvas { display: block; }

      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }
      #hud h1 {
        margin: 0 0 6px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      #hud dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto auto;
        gap: 0 12px;
        color: var(--dim);
      }
      #hud dt { color: var(--dim); }
      #hud dd { margin: 0; color: var(--fg); }

      #help {
        position: fixed;
        bottom: 12px;
        left: 12px;
        color: var(--dim);
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }

      #legend {
        position: fixed;
        top: 12px;
        right: 12px;
        display: grid;
        gap: 3px;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }
      #legend div {
        display: grid;
        grid-template-columns: 9px auto;
        align-items: center;
        gap: 7px;
      }
      #legend i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }

      #warning {
        position: fixed;
        bottom: 12px;
        right: 12px;
        max-width: 44ch;
        text-align: right;
        color: #ffb27a;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }

      #controls {
        position: fixed;
        top: 130px;
        left: 12px;
        width: 232px;
        display: grid;
        gap: 10px;
      }
      #controls input[type='search'],
      #controls select {
        width: 100%;
        padding: 5px 7px;
        font: inherit;
        color: var(--fg);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 4px;
      }
      #controls label {
        display: grid;
        gap: 3px;
        color: var(--dim);
        font-size: 11px;
      }
      #search-count {
        color: var(--dim);
        min-height: 1.5em;
      }
      #reset {
        justify-self: start;
        padding: 4px 9px;
        font: inherit;
        color: var(--dim);
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 4px;
        cursor: pointer;
      }
      #reset:hover { color: var(--fg); }

      #detail {
        position: fixed;
        bottom: 44px;
        left: 12px;
        width: 320px;
        padding: 12px 14px;
        background: rgba(14, 16, 22, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 6px;
      }
      #detail h2 {
        margin: 0 0 8px;
        font-size: 13px;
        line-height: 1.35;
      }
      #detail dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        font-size: 11px;
      }
      #detail dt { color: var(--dim); }
      #detail dd { margin: 0; overflow-wrap: anywhere; }
      #detail a { color: #7fc4ff; }
      #detail .close {
        position: absolute;
        top: 8px;
        right: 10px;
        color: var(--dim);
        background: none;
        border: 0;
        font: inherit;
        cursor: pointer;
      }
      #detail .neighbors {
        margin-top: 9px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--dim);
        font-size: 11px;
      }

      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        gap: 8px;
        background: var(--bg);
        transition: opacity 240ms ease;
      }
      #status.hidden { opacity: 0; pointer-events: none; }
      #status .detail { color: var(--dim); max-width: 46ch; }
      #status.error .headline { color: #ff8f6b; }
    </style>
  </head>
  <body>
    <div id="hud" hidden>
      <h1>Latent Space Explorer</h1>
      <dl>
        <dt>Punkte</dt><dd id="stat-points">—</dd>
        <dt>Backend</dt><dd id="stat-backend">—</dd>
        <dt>Frame</dt><dd id="stat-frame">—</dd>
        <dt>Draw Calls</dt><dd id="stat-draws">—</dd>
      </dl>
    </div>

    <div id="legend" hidden></div>

    <div id="controls" hidden>
      <label>
        Titel durchsuchen
        <input id="search" type="search" placeholder="z. B. Vase" autocomplete="off" />
      </label>
      <div id="search-count"></div>
      <div id="filters"></div>
      <button id="reset" type="button">Zurücksetzen</button>
    </div>

    <div id="detail" hidden>
      <button class="close" type="button" aria-label="Schließen">✕</button>
      <h2 id="detail-title"></h2>
      <dl id="detail-fields"></dl>
      <div class="neighbors" id="detail-neighbors"></div>
    </div>

    <div id="help" hidden>
      Ziehen = drehen &nbsp;·&nbsp; Klick = auswählen &nbsp;·&nbsp; Doppelklick = hinfliegen
      &nbsp;·&nbsp; Esc = Übersicht
    </div>

    <div id="warning" hidden></div>

    <div id="status">
      <div class="headline">Lade Artefakte …</div>
      <div class="detail" id="status-detail">data/sample</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
